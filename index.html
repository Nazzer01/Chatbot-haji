<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembantu Rukun Haji & Umrah</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Marcellus&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --bg:#0e1f1a;
    --bg2:#13312a;
    --panel:#0b1a16;
    --card:#11241e;
    --gold:#d9b46a;
    --gold-soft:#e8cf9a;
    --green:#1f6b54;
    --green-light:#2e8f72;
    --ink:#eef3ec;
    --muted:#9fb5ac;
    --user:#1f4c3f;
    --line:rgba(217,180,106,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Jost',sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(46,143,114,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(217,180,106,.12), transparent 55%),
      var(--bg);
    color:var(--ink);
    display:flex;justify-content:center;
    min-height:100vh;
  }
  .frame{
    width:100%;max-width:760px;display:flex;flex-direction:column;
    min-height:100vh;position:relative;
  }
  /* decorative geometric border top */
  .topband{
    background:linear-gradient(180deg,var(--bg2),var(--panel));
    border-bottom:1px solid var(--line);
    padding:22px 26px 18px;position:relative;overflow:hidden;
  }
  .topband::after{
    content:"";position:absolute;inset:0;opacity:.10;
    background-image:
      repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 14px);
    -webkit-mask:linear-gradient(180deg,#000,transparent);
            mask:linear-gradient(180deg,#000,transparent);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .seal{
    width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold) 55%,#a9823f);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px rgba(217,180,106,.15), 0 8px 20px rgba(0,0,0,.4);
  }
  .seal svg{width:30px;height:30px}
  .brand h1{
    font-family:'Marcellus',serif;font-size:1.5rem;font-weight:400;
    letter-spacing:.5px;color:var(--gold-soft);line-height:1.1;
  }
  .brand .ar{font-family:'Amiri',serif;color:var(--muted);font-size:.95rem;margin-top:2px}
  .scope{
    margin-top:14px;position:relative;z-index:1;
    font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .scope .dot{width:7px;height:7px;border-radius:50%;background:var(--green-light);box-shadow:0 0 8px var(--green-light)}

  /* mode tabs */
  .tabs{display:flex;gap:8px;padding:14px 20px 0}
  .tab{
    flex:1;text-align:center;padding:10px;border-radius:12px 12px 0 0;cursor:pointer;
    font-weight:500;font-size:.92rem;letter-spacing:.3px;
    background:transparent;color:var(--muted);border:1px solid transparent;border-bottom:none;
    transition:.2s;
  }
  .tab.active{background:var(--card);color:var(--gold-soft);border-color:var(--line)}
  .tab:hover:not(.active){color:var(--ink)}

  /* chat area */
  .stage{flex:1;display:flex;flex-direction:column;background:var(--card);
    border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
  .messages{flex:1;overflow-y:auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:14px}
  .messages::-webkit-scrollbar{width:8px}
  .messages::-webkit-scrollbar-thumb{background:rgba(217,180,106,.25);border-radius:8px}

  .msg{max-width:84%;padding:13px 16px;border-radius:16px;font-size:.95rem;line-height:1.55;animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bot{align-self:flex-start;background:linear-gradient(180deg,#163029,#122620);
    border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
  .user{align-self:flex-end;background:linear-gradient(180deg,var(--user),#163b30);
    border-bottom-right-radius:5px;color:#eaf6f0}
  .bot b,.quiz-q b{color:var(--gold-soft)}
  .bot .tag{display:inline-block;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;
    color:var(--gold);opacity:.8;margin-bottom:5px}

  /* suggestion chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 4px}
  .chip{
    font-size:.82rem;padding:8px 13px;border-radius:20px;cursor:pointer;
    background:rgba(217,180,106,.08);border:1px solid var(--line);color:var(--gold-soft);
    transition:.18s;
  }
  .chip:hover{background:rgba(217,180,106,.18);transform:translateY(-1px)}

  /* input */
  .composer{display:flex;gap:10px;padding:14px 20px;background:var(--panel);
    border-top:1px solid var(--line)}
  .composer input{
    flex:1;background:#0c1d18;border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;color:var(--ink);font-family:inherit;font-size:.95rem;outline:none;
  }
  .composer input:focus{border-color:var(--gold)}
  .send{
    width:48px;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1410;
    display:flex;align-items:center;justify-content:center;transition:.18s;
  }
  .send:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .send svg{width:20px;height:20px}

  /* quiz */
  .quiz-wrap{padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
  .quiz-card{background:linear-gradient(180deg,#163029,#112420);border:1px solid var(--line);
    border-radius:16px;padding:20px}
  .quiz-meta{font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:8px}
  .quiz-q{font-size:1.08rem;line-height:1.5;margin-bottom:16px;font-family:'Marcellus',serif;color:var(--ink)}
  .opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:9px;cursor:pointer;
    background:#0e211b;border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-family:inherit;font-size:.93rem;transition:.15s}
  .opt:hover{border-color:var(--gold);background:#11271f}
  .opt.correct{background:rgba(46,143,114,.25);border-color:var(--green-light);color:#d8f5e9}
  .opt.wrong{background:rgba(180,60,60,.2);border-color:#b06b6b;color:#f3d9d9}
  .opt:disabled{cursor:default}
  .feedback{margin-top:6px;font-size:.9rem;line-height:1.5;padding:12px 14px;border-radius:10px;
    background:rgba(217,180,106,.07);border:1px solid var(--line);display:none}
  .feedback.show{display:block;animation:rise .25s ease both}
  .quiz-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .scorebar{font-size:.9rem;color:var(--muted)}
  .scorebar b{color:var(--gold-soft)}
  .nextbtn{padding:11px 20px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;
    font-weight:500;background:linear-gradient(180deg,var(--green-light),var(--green));color:#eaf6f0;transition:.18s}
  .nextbtn:hover{filter:brightness(1.1)}
  .nextbtn:disabled{opacity:.4;cursor:not-allowed}
  .restart{background:transparent;border:1px solid var(--line);color:var(--gold-soft)}

  .hidden{display:none !important}
  .note{font-size:.72rem;color:var(--muted);text-align:center;padding:8px 20px 16px;opacity:.7;line-height:1.5}
</style>

<div class="frame">
  <div class="topband">
    <div class="brand">
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c-1 3-3 4-3 7a3 3 0 0 0 6 0c0-3-2-4-3-7z" fill="#1a1410"/><rect x="5" y="14" width="14" height="7" rx="1.5" fill="#1a1410"/><rect x="9" y="14" width="6" height="7" fill="#d9b46a"/></svg>
      </div>
      <div>
        <h1>Pembantu Rukun Haji &amp; Umrah</h1>
        <div class="ar">&#x645;&#x631;&#x634;&#x62F; &#x623;&#x631;&#x643;&#x627;&#x646; &#x627;&#x644;&#x62D;&#x62C; &#x648;&#x627;&#x644;&#x639;&#x645;&#x631;&#x629;</div>
      </div>
    </div>
    <div class="scope"><span class="dot"></span> Fokus topik: Rukun Haji &amp; Umrah sahaja &mdash; PLG726</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-mode="chat" onclick="switchMode('chat')">Tanya Soalan</div>
    <div class="tab" data-mode="quiz" onclick="switchMode('quiz')">Mod Kuiz</div>
  </div>

  <!-- CHAT MODE -->
  <div class="stage" id="chatStage">
    <div class="messages" id="messages"></div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <input id="input" placeholder="Taip soalan tentang rukun haji atau umrah..." autocomplete="off"
             onkeydown="if(event.key==='Enter')handleSend()">
      <button class="send" onclick="handleSend()" aria-label="Hantar">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="#1a1410"/></svg>
      </button>
    </div>
    <div class="note">Pembantu ini hanya menjawab dalam skop rukun haji &amp; umrah untuk memastikan pelajar kekal fokus.</div>
  </div>

  <!-- QUIZ MODE -->
  <div class="stage hidden" id="quizStage">
    <div class="quiz-wrap" id="quizWrap"></div>
  </div>
</div>

<script>
/* ============================================================
   KNOWLEDGE BASE — Rukun Haji & Umrah (topik terhad)
   Disusun mengikut mazhab Syafi'i (rujukan umum di Malaysia).
   Guru boleh ubah/tambah kandungan di bawah dengan mudah.
============================================================ */
const KB = [
  {
    keys:["rukun haji","apa rukun haji","senarai rukun haji","berapa rukun haji"],
    tag:"Rukun Haji",
    answer:"<b>Rukun haji ada 6 (mazhab Syafi&#x2019;i):</b><br>1. Ihram (berniat memulakan haji)<br>2. Wukuf di Arafah<br>3. Tawaf Ifadah<br>4. Sa&#x2019;i (antara Safa dan Marwah)<br>5. Tahallul (bercukur / bergunting rambut)<br>6. Tertib (mengikut susunan)<br><br>Jika satu rukun ditinggalkan, haji tidak sah dan tidak boleh diganti dengan dam."
  },
  {
    keys:["rukun umrah","apa rukun umrah","senarai rukun umrah","berapa rukun umrah"],
    tag:"Rukun Umrah",
    answer:"<b>Rukun umrah ada 5 (mazhab Syafi&#x2019;i):</b><br>1. Ihram<br>2. Tawaf<br>3. Sa&#x2019;i<br>4. Tahallul (bercukur / bergunting)<br>5. Tertib<br><br>Perhatikan: umrah <b>tiada wukuf</b> &mdash; inilah beza utama dengan haji."
  },
  {
    keys:["beza haji umrah","perbezaan haji dan umrah","beza rukun haji umrah"],
    tag:"Perbandingan",
    answer:"<b>Beza utama haji &amp; umrah:</b><br>&bull; Haji ada <b>Wukuf di Arafah</b>; umrah tiada.<br>&bull; Haji ada waktu tertentu (musim haji); umrah boleh bila-bila masa.<br>&bull; Rukun haji = 6, rukun umrah = 5.<br>Selebihnya (ihram, tawaf, sa&#x2019;i, tahallul, tertib) adalah sama."
  },
  {
    keys:["ihram","apa itu ihram","niat ihram","maksud ihram"],
    tag:"Ihram",
    answer:"<b>Ihram</b> ialah niat memulakan ibadah haji atau umrah, disertai memakai pakaian ihram dan meninggalkan larangan ihram. Ia adalah rukun pertama. Niat inilah yang membezakan sama ada seseorang berniat haji, umrah, atau kedua-duanya."
  },
  {
    keys:["wukuf","arafah","wukuf di arafah","apa itu wukuf"],
    tag:"Wukuf",
    answer:"<b>Wukuf di Arafah</b> ialah berada di padang Arafah pada 9 Zulhijjah (dari gelincir matahari hingga subuh 10 Zulhijjah). Ia adalah <b>rukun terpenting haji</b> &mdash; sabda Nabi SAW maksudnya: &#x201C;Haji itu Arafah.&#x201D; Sesiapa tertinggal wukuf, hajinya tidak sah."
  },
  {
    keys:["tawaf","apa itu tawaf","tawaf ifadah"],
    tag:"Tawaf",
    answer:"<b>Tawaf</b> ialah mengelilingi Kaabah sebanyak 7 pusingan, bermula dari Hajar Aswad, dengan Kaabah di sebelah kiri. <b>Tawaf Ifadah</b> ialah tawaf rukun haji yang dilakukan selepas wukuf."
  },
  {
    keys:["sa'i","sai","saie","safa marwah","apa itu sai"],
    tag:"Sa&#x2019;i",
    answer:"<b>Sa&#x2019;i</b> ialah berjalan/berlari anak antara bukit <b>Safa</b> dan <b>Marwah</b> sebanyak 7 kali (Safa &rarr; Marwah dikira 1). Ia mengingati usaha Siti Hajar mencari air untuk Nabi Ismail AS."
  },
  {
    keys:["tahallul","bercukur","bergunting","tahalul"],
    tag:"Tahallul",
    answer:"<b>Tahallul</b> ialah bercukur atau menggunting rambut sebagai tanda keluar dari ihram. Bagi lelaki digalakkan bercukur licin; bagi wanita memadai memotong sedikit hujung rambut."
  },
  {
    keys:["tertib","susunan","urutan rukun"],
    tag:"Tertib",
    answer:"<b>Tertib</b> bermaksud melakukan rukun mengikut susunan yang betul, contohnya ihram dahulu, kemudian wukuf, tawaf, sa&#x2019;i dan tahallul. Tertib sendiri dikira sebagai satu rukun haji."
  },
  {
    keys:["larangan ihram","pantang ihram","apa tak boleh masa ihram"],
    tag:"Larangan Ihram",
    answer:"<b>Antara larangan ketika ihram:</b> memakai pakaian berjahit (lelaki), menutup kepala (lelaki) / menutup muka &amp; sarung tangan (wanita), memakai wangian, memotong rambut/kuku, memburu binatang darat, dan berkahwin/berakad nikah. (Topik ini sokongan sahaja &mdash; fokus pelajaran ialah rukun.)"
  },
  {
    keys:["wajib haji","beza rukun wajib","wajib dan rukun"],
    tag:"Rukun vs Wajib",
    answer:"<b>Beza rukun dan wajib haji:</b><br>&bull; <b>Rukun</b> &mdash; jika ditinggalkan, haji TIDAK sah dan tak boleh diganti.<br>&bull; <b>Wajib</b> &mdash; jika ditinggalkan, haji tetap sah tetapi kena bayar <b>dam</b> (denda). Contoh wajib: bermalam di Muzdalifah &amp; Mina, melontar jamrah."
  }
];

const FALLBACK = "Maaf, pembantu ini hanya menjawab soalan dalam skop <b>rukun haji &amp; umrah</b>. Cuba tanya seperti: &#x201C;Apa rukun haji?&#x201D;, &#x201C;Apa itu wukuf?&#x201D;, atau &#x201C;Beza haji dan umrah?&#x201D;";

const SUGGESTIONS = ["Apa rukun haji?","Apa rukun umrah?","Beza haji & umrah?","Apa itu wukuf?","Apa itu sa'i?","Beza rukun & wajib?"];

/* ---------- chat logic ---------- */
const messagesEl=document.getElementById('messages');
const chipsEl=document.getElementById('chips');
const inputEl=document.getElementById('input');

function addMsg(html,who){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.innerHTML=html;
  messagesEl.appendChild(d);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}
function findAnswer(text){
  const q=text.toLowerCase().replace(/[?.,!]/g,' ');
  let best=null,bestScore=0;
  for(const item of KB){
    for(const k of item.keys){
      const words=k.split(' ');
      let hits=0;
      for(const w of words){ if(q.includes(w)) hits++; }
      const score=hits/words.length + (q.includes(k)?1:0);
      if(score>bestScore){bestScore=score;best=item;}
    }
  }
  if(best && bestScore>=0.5){
    return "<span class='tag'>"+best.tag+"</span>"+best.answer;
  }
  return FALLBACK;
}
function handleSend(){
  const t=inputEl.value.trim();
  if(!t)return;
  addMsg(t,'user');
  inputEl.value='';
  setTimeout(()=>addMsg(findAnswer(t),'bot'),320);
}
function ask(q){ inputEl.value=q; handleSend(); }

function renderChips(){
  chipsEl.innerHTML='';
  SUGGESTIONS.forEach(s=>{
    const c=document.createElement('div');
    c.className='chip';c.textContent=s;c.onclick=()=>ask(s);
    chipsEl.appendChild(c);
  });
}

/* ---------- quiz logic ---------- */
const QUIZ=[
  {q:"Berapakah jumlah rukun haji mengikut mazhab Syafi&#x2019;i?",
   opts:["4","5","6","7"],ans:2,
   fb:"Rukun haji ada <b>6</b>: ihram, wukuf, tawaf ifadah, sa&#x2019;i, tahallul, dan tertib."},
  {q:"Rukun manakah yang ADA dalam haji tetapi TIADA dalam umrah?",
   opts:["Tawaf","Sa&#x2019;i","Wukuf di Arafah","Ihram"],ans:2,
   fb:"<b>Wukuf di Arafah</b> hanya ada dalam haji. Itulah beza utama haji dan umrah."},
  {q:"Apakah rukun pertama bagi haji dan umrah?",
   opts:["Tawaf","Ihram","Sa&#x2019;i","Tahallul"],ans:1,
   fb:"<b>Ihram</b> (berniat) ialah rukun pertama bagi kedua-dua haji dan umrah."},
  {q:"Sa&#x2019;i dilakukan antara dua bukit, iaitu...",
   opts:["Safa & Marwah","Arafah & Mina","Uhud & Thur","Safa & Muzdalifah"],ans:0,
   fb:"<b>Sa&#x2019;i</b> ialah berjalan antara <b>Safa</b> dan <b>Marwah</b> sebanyak 7 kali."},
  {q:"Jika satu RUKUN haji ditinggalkan, apa hukumnya?",
   opts:["Haji tetap sah, bayar dam","Haji tidak sah","Cukup ganti tahun depan","Tiada apa-apa kesan"],ans:1,
   fb:"Meninggalkan <b>rukun</b> menyebabkan haji <b>tidak sah</b> dan tak boleh diganti dengan dam. (Beza dengan 'wajib' yang boleh diganti dengan dam.)"},
  {q:"Berapa pusingan tawaf mengelilingi Kaabah?",
   opts:["3","5","7","9"],ans:2,
   fb:"<b>Tawaf</b> ialah 7 pusingan, bermula dari Hajar Aswad."}
];
let qi=0,score=0,answered=false;
const quizWrap=document.getElementById('quizWrap');

function renderQuiz(){
  answered=false;
  const item=QUIZ[qi];
  quizWrap.innerHTML=`
    <div class="quiz-card">
      <div class="quiz-meta">Soalan ${qi+1} / ${QUIZ.length}</div>
      <div class="quiz-q">${item.q}</div>
      <div id="opts"></div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="quiz-actions">
      <div class="scorebar">Skor: <b>${score}</b> / ${QUIZ.length}</div>
      <button class="nextbtn" id="nextBtn" disabled onclick="nextQuiz()">${qi===QUIZ.length-1?'Lihat Keputusan':'Soalan Seterusnya'}</button>
    </div>`;
  const optsEl=document.getElementById('opts');
  item.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.innerHTML=o;
    b.onclick=()=>pick(i,b);
    optsEl.appendChild(b);
  });
}
function pick(i,btn){
  if(answered)return;
  answered=true;
  const item=QUIZ[qi];
  const all=document.querySelectorAll('.opt');
  all.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===item.ans)b.classList.add('correct');
  });
  if(i===item.ans){score++;}
  else{btn.classList.add('wrong');}
  const fb=document.getElementById('fb');
  fb.innerHTML=(i===item.ans?"&#x2705; Betul! ":"&#x274C; Belum tepat. ")+item.fb;
  fb.classList.add('show');
  document.getElementById('nextBtn').disabled=false;
  document.querySelector('.scorebar').innerHTML=`Skor: <b>${score}</b> / ${QUIZ.length}`;
}
function nextQuiz(){
  if(qi<QUIZ.length-1){qi++;renderQuiz();}
  else{showResult();}
}
function showResult(){
  const pct=Math.round(score/QUIZ.length*100);
  let msg = pct>=80?"Cemerlang! Anda faham rukun haji & umrah dengan baik. &#x1F31F;"
           : pct>=50?"Bagus! Ulang kaji rukun yang tersilap tadi. &#x1F4D6;"
           : "Jangan risau &mdash; cuba mod 'Tanya Soalan' dahulu, kemudian ulang kuiz. &#x1F4AA;";
  quizWrap.innerHTML=`
    <div class="quiz-card" style="text-align:center">
      <div class="quiz-meta">Keputusan Kuiz</div>
      <div style="font-family:'Marcellus',serif;font-size:2.6rem;color:var(--gold-soft);margin:6px 0">${score} / ${QUIZ.length}</div>
      <div style="color:var(--muted);margin-bottom:6px">${pct}% betul</div>
      <div class="quiz-q" style="font-size:1rem;margin-top:10px">${msg}</div>
    </div>
    <div class="quiz-actions" style="justify-content:center">
      <button class="nextbtn restart" onclick="restartQuiz()">Cuba Semula</button>
    </div>`;
}
function restartQuiz(){qi=0;score=0;renderQuiz();}

/* ---------- mode switch ---------- */
function switchMode(m){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  document.getElementById('chatStage').classList.toggle('hidden',m!=='chat');
  document.getElementById('quizStage').classList.toggle('hidden',m!=='quiz');
  if(m==='quiz' && quizWrap.children.length===0) renderQuiz();
}

/* ---------- init ---------- */
addMsg("<span class='tag'>Selamat Datang</span><b>Assalamualaikum!</b> Saya pembantu pembelajaran khusus untuk topik <b>Rukun Haji &amp; Umrah</b>. Tanya saya apa-apa tentang rukun, atau cuba <b>Mod Kuiz</b> di atas untuk menguji kefahaman anda.",'bot');
renderChips();
</script>
